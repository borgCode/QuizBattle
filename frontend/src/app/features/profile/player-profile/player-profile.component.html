
<div class="container p-5" style="height: 100%">
  <div class="container">
    <div class="row text-center g-4">
      <div class="col-md-4">
        <div class="card">
          <img src="https://placehold.co/400" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">{{ player?.displayName }}</h5>
            <a href="#" class="btn btn-primary">Edit Profile</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">Stats</div>
          <div class="card-body">
            <ul class="list-group">
              <li class="list-group-item">Total games played: {{ player?.stats.numOfGames }}</li>
              <li class="list-group-item">Wins: {{ player?.stats.numOfWins }}</li>
              <li class="list-group-item">Losses: {{ player?.stats.numOfLosses }}</li>

              <!--            //TODO win rate for userDTO-->
              <!--            <li class="list-group-item">Win rate: {{ user?.numOfLosses }}</li>-->
            </ul>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <app-friends-panel [friendsList]="friendsList"></app-friends-panel>
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 offset-md-4"></div>
    </div>
  </div>
  <app-category-pie-chart [categoryStats]=player.stats.categoryStats></app-category-pie-chart>
</div>
