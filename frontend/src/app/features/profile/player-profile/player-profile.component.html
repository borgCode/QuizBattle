<div class="container p-5">
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card" style="max-height: 400px;">
        <img [src]="image" class="card-img-top img-fluid" style="max-height: 250px">
        <div class="card-body text-center py-1">
          <h5 class="card-title">{{ player?.displayName }}</h5>
          <a (click)="openEditProfile()" class="btn btn-primary">Edit Profile</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card" style="max-height: 400px;">
        <div class="card-header">Stats</div>
        <div class="card-body">
          <ul class="list-group">
            <li class="list-group-item">Total games played: {{ player?.stats.numOfGames }}</li>
            <li class="list-group-item">Wins: {{ player?.stats.numOfWins }}</li>
            <li class="list-group-item">Losses: {{ player?.stats.numOfLosses }}</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card" style="max-height: 400px;">
        <ul class="nav nav-tabs nav-justified">
          <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#friends">Friends</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#blocked">Blocked</a>
          </li>
        </ul>
        <div class="tab-content relationship-panel" style="overflow-y: auto;">
          <div class="tab-pane fade show active p-2" id="friends">
            <app-relationship-panel
              [relationships]="friendsList"
              [type]="'friends'"
              (relationshipActionSelected)="handleAction($event)">
            </app-relationship-panel>
          </div>
          <div class="tab-pane fade p-2" id="blocked">
            <app-relationship-panel
              [relationships]="blockedList"
              [type]="'blocked'"
              (relationshipActionSelected)="handleAction($event)">
            </app-relationship-panel>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <ul class="nav nav-tabs nav-justified">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#category">Friends</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#achievements">Blocked</a>
        </li>
      </ul>
      <ng-container *ngIf="playerData$ | async as player">
        <app-category-pie-chart
          [categoryStats]="player.stats.categoryStats">
        </app-category-pie-chart>
      </ng-container>
    </div>
  </div>
</div>
