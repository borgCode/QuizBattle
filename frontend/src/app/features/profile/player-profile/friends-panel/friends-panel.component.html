<ng-container *ngFor="let friend of friendsList">
  <div class="row align-items-center bg-light">
    <div class="player-avatar col 6  p-2 me-3">
      <img [src]="'data:image/jpeg;base64,' + friend.base64Image" style="max-height: 40px; max-width: 40px"
           alt="player avatar" class="rounded-circle"/>
    </div>
    <div class="player-name col 6 fw-bold">{{ friend.displayName }}</div>
  </div>
</ng-container>
