<div class="match-dialog">
  <h2 class="dialog-title">Match Found!</h2>

  <div class="opponent-info">
    You've been matched with
    <span class="opponent-name">{{data.opponentName}}</span>
  </div>


  <div class="actions">
    <button class="accept-btn" (click)="onAccept()">Accept</button>
    <button class="decline-btn" (click)="onDecline()">Decline</button>
  </div>
</div>
