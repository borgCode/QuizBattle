<div class="container p-5">
  <div class="container g-4">
    <div class="row mb-4 g-3">
      <div class="col-md-3">
        <app-player-card
          maxHeight="250px"
          [playerDisplayName]="player.displayName"
          [playerAvatar]="image"
        ></app-player-card>
      </div>
      <div class="col-md-3 align-content-center">
        <div (click)="!isSearching && !waitingForOpponent && findGame()"
             class="btn btn-success btn-lg"
             [class.disabled]="isSearching || waitingForOpponent"
             [ngStyle]="{'cursor': (isSearching || waitingForOpponent) ? 'not-allowed' : 'pointer'}">
          {{ getButtonText() }}
          <span *ngIf="isSearching || waitingForOpponent" class="loading-dots"></span>
        </div>
      </div>
      <div class="col-md-3 align-content-center" *ngIf="shouldShowCancelMatchmaking">
        <div class="btn btn-danger btn-lg"
             (click)="leaveMatchmakingQueue()">
          Stop searching
        </div>
      </div>
      <div class="col-md-3 align-content-center">
        <div (click)="!isSearching && openFriendDialog()"
             class="btn btn-success btn-lg">
          Send invite to friend
        </div>
      </div>
    </div>
    <div class="row">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="mb-0 text-center">Games</h5>
        </div>
        <div class="card-body p-0">
          <ul class="list-group mb-3">
            <ng-container *ngFor="let gameSession of gameSessions">
              <li (click)="openGame(gameSession.id)" class="list-group-item ju" style="cursor: pointer;">
                <div class="row align-items-center">
                  <!-- Player 1 Section -->
                  <div class="col-md-4 d-flex align-items-center">
                    <div class="player-avatar bg-light rounded-circle p-2 me-3">
                      <img [src]="'data:image/jpeg;base64,' + gameSession.playerDTO.base64Image"
                           style="max-height: 40px; max-width: 40px" alt="Player 1" class="rounded-circle"/>
                    </div>
                    <div class="player-info">
                      <div class="fw-bold">{{ gameSession.playerDTO.displayName }}</div>
                      <div class="text-primary fs-4">{{ gameSession.playerDTO.score }}</div>
                    </div>
                  </div>

                  <!-- VS Section -->
                  <div class="col-md-4 text-center">
                    <div class="versus-badge">
                      <span class="badge bg-light text-dark px-4 py-2">VS</span>
                    </div>
                    <div class="mt-2">
                      <!--                      TODO win/loss instead of complete-->
                      <ng-container [ngSwitch]="gameSession.status">
                        <span *ngSwitchCase="'ACTIVE'" class="badge bg-primary rounded-pill px-3">Active</span>
                        <span *ngSwitchCase="'COMPLETED'" class="badge bg-success rounded-pill px-3">Completed</span>
                      </ng-container>
                    </div>
                  </div>

                  <!-- Player 2 Section -->
                  <div class="col-md-4 d-flex align-items-center justify-content-end">
                    <div class="player-info text-end">
                      <div class="fw-bold">{{ gameSession.opponentDTO.displayName }}</div>
                      <div class="text-primary fs-4">{{ gameSession.opponentDTO.score }}</div>
                    </div>
                    <div class="player-avatar bg-light rounded-circle p-2 ms-3">
                      <img [src]="'data:image/jpeg;base64,' + gameSession.opponentDTO.base64Image"
                           style="max-height: 40px; max-width: 40px" alt="Player 2" class="rounded-circle"/>
                    </div>
                  </div>
                </div>
              </li>
            </ng-container>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
