<div class="container p-2">
  <div class="row align-items-center" style="height: 250px">
    <div class="col-4 col-sm-3 offset-sm-1 d-flex flex-column justify-content-center">
      <app-player-card
        [playerAvatar]="'data:image/jpeg;base64,' + gameState.playerDTOS[(opponentIndex + 1) % 2].base64Image"
        [playerDisplayName]="gameState.playerDTOS[(opponentIndex + 1) % 2].displayName"></app-player-card>
    </div>
    <div class="score-panel col-4 col-sm-4 align-content-center text-center">
      <p>{{ playerTotalScore }}
        - {{ opponentTotalScore }}</p>
    </div>
    <div class="col-4 col-sm-3 offset-sm-1 d-flex flex-column justify-content-center">
      <app-player-card
        [playerAvatar]="opponentAvatar"
        [playerDisplayName]="opponentDisplayName"></app-player-card>
      <div (click)="sendFriendRequest(gameState.playerDTOS[opponentIndex].id)" class="btn btn-primary mt-2">Send
        friend request
      </div>
    </div>
  </div>
  <div class="container p-2">
    <div class="row align-items-center mt-3" *ngFor="let row of boxes; let i = index">
      <div class="col-4 d-flex justify-content-end">
        <div
          class="square mx-1"
          *ngFor="let box of row.left"
          [style.background-color]="box.color">
        </div>
      </div>
      <div class="col-4 text-center">
        <h5 class="category-text">{{ gameState.roundCategories[i] }}</h5>
      </div>
      <div class="col-4 d-flex justify-content-start">
        <div
          class="square mx-1"
          *ngFor="let box of row.right"
          [style.background-color]="box.color">
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-12 text-center">
      <div *ngIf="!isGameOver; else gameOverBlock">
        <div class="btn btn-danger btn-lg me-5" data-bs-toggle="modal" data-bs-target="#giveUpModal">
          Give up
        </div>
        <div *ngIf="gameState.playerTurn === storedPlayerId; else elseBlock"
             (click)="handleButtonClick()"
             class="btn btn-success btn-lg">
          Play
        </div>
        <ng-template #elseBlock>
          <div class="btn btn-secondary" disabled="">
            Waiting for other player
          </div>
        </ng-template>
      </div>
      <ng-template #gameOverBlock>
        <div class="btn btn-success btn-lg me-5" (click)="backToMultiplayerPage()">
          Back to menu
        </div>
        <div class="btn btn-success btn-lg" (click)="sendRematchRequest()">
          Play again
        </div>
      </ng-template>
    </div>
  </div>
</div>

<div class="modal fade" id="giveUpModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Give up</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to give up?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-danger" (click)="giveUpClick()" data-bs-dismiss="modal">Yes</button>
      </div>
    </div>
  </div>
</div>
