<h2 mat-dialog-title>{{data.contentTitle}}</h2>
<mat-dialog-content>
  {{data.message}}
</mat-dialog-content>
<mat-dialog-actions>
  <div cdkTrapFocus cdkTrapFocusAutoCapture="true">
  <button *ngIf="!data.onlyOkButton" mat-button mat-dialog-close>No</button>
  <button mat-button mat-dialog-close="yes" cdkFocusInitial>{{ data.onlyOkButton ? 'OK' : 'YES' }}</button>
  </div>
</mat-dialog-actions>
