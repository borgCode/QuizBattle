<div class="container p-5">
  <app-chapter-header
    [chapterData$]="chapterData$"
    [currentHealth]="currentHealth"
    [lastLostHeart]="lastLostHeart"
    [showQuiz]="showQuiz"
    (startQuiz)="showQuiz = true">
  </app-chapter-header>

  <ng-container *ngIf="showQuiz">
    <div class="row justify-content-center">
      <div class="col-12">
        <app-question-panel
          [question]="currentQuestion"
          [isCorrect]="answerIsCorrect"
          [correctAnswerIndex]="correctAnswerIndex"
          *ngIf="hasQuestions"
          (answerSelected)="onAnswerSelected($event)"
          (timerRanOut)="onTimerRanOut($event)"
          (handleChapterRound)="handleRoundFinished()"
          (nextQuestion)="onNextQuestion()"
        ></app-question-panel>
      </div>
    </div>
  </ng-container>
</div>
