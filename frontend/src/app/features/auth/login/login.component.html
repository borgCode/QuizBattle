<div class="container"
     (keydown.enter)="login()">
  <h2 class="text-center">Login</h2>
  <hr>
  <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
    <p *ngFor="let msg of errorMsg">{{ msg }}</p>
  </div>

    <div class="mb-3">
      <label for="inputUsername" class="form-label">Username</label>
      <input type="text" class="form-control" id="inputUsername" placeholder="Username" [(ngModel)]="authRequest.username">
    </div>
    <div class="mb-3">
      <label for="inputPassword" class="form-label">Password</label>
      <input type="password" class="form-control" id="inputPassword" placeholder="Password" [(ngModel)]="authRequest.password">
    </div>
    <div class="d-flex justify-content-between mb-3">
    <button (click)="login()" type="button" class="btn btn-primary">Login</button>
      <div>
        Don't have an account?&nbsp;
        <button (click)="register()" type="button" class="btn btn-link">Register</button>
      </div>
    </div>

</div>
