<div class="notification-item card mb-3 border-0 shadow-sm">
  <div class="card-body p-3 p-md-4">
    <ng-container *ngIf="notification">
      <div class="notification-text">
        <p class="card-text mb-2 text-dark">{{ notification.message }}</p>
        <div class="d-flex flex-column flex-md-row gap-2 gap-md-4 text-muted small">
          <span class="d-inline-flex align-items-center">
            <i class="icon-clock me-1"></i>
            <span>{{ notification.createdAt | date:'short' }}</span>
          </span>
          <span class="d-inline-flex align-items-center">
            <i class="icon-archive me-1"></i>
            <span>{{ notification.type.charAt(0).toUpperCase() + notification.type.slice(1).toLowerCase().replace('_', ' ') }}</span>
          </span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
