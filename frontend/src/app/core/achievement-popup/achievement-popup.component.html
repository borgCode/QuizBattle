<div class="achievement-container position-fixed top-50 end-50"
     [@popupState]="isVisible ? 'show' : 'hide'">
  <div class="card">
    <img src="https://placehold.co/200" alt="Achievement">
    <div class="card-body">
      <h5 class="card-title">Achievement Earned!</h5>
      <h6 class="card-title">{{ currentAchievement.achievementName }}</h6>
      <div class="p card-text">{{currentAchievement.achievementDescription}}</div>
    </div>
  </div>
</div>
