<div class="whisper-window">
  <div class="title-bar">
    <div class="d-flex justify-content-between ">
      <div class="player-info justify-content-start d-flex align-items-center">
        <img [src]="'data:image/jpeg;base64,' + conversation.otherPlayer.base64Image"
             style="max-height: 40px; max-width: 40px"
             alt="player avatar" class="rounded-circle"/>
        <h6 class="ms-2">{{ conversation.otherPlayer.displayName }}</h6>
      </div>
      <div class="btn btn-light d-flex" (click)="closeConversation()">
        <i class="fa-solid fa-x"></i>
      </div>
    </div>
  </div>
  <div class="message-area" #messageArea>
    <ng-container *ngFor="let message of conversation.messages">
      <ng-container *ngIf="message.senderId == this.storedPlayer.id; else elseBlock">
        <div class="message-item text-break" #messageElement [attr.data-message-id]="message.id">
          <span class="player">{{ this.storedPlayer.displayName }}: </span>
          <span class="message-text">{{ message.content }}</span>
        </div>
      </ng-container>
      <ng-template #elseBlock>
        <div class="message-item text-break" #messageElement [attr.data-message-id]="message.id">
          <span class="other-player">{{ conversation.otherPlayer.displayName }}: </span>
          <span class="message-text">{{ message.content }}</span>
        </div>
      </ng-template>
    </ng-container>
    <ng-container *ngFor="let message of newMessages$ | async">
      <ng-container *ngIf="message.senderId == this.storedPlayer.id; else newElseBlock">
        <div class="message-item text-break" #messageElement [attr.data-message-id]="message.id">
          <span class="player">{{ this.storedPlayer.displayName }}: </span>
          <span class="message-text">{{ message.content }}</span>
        </div>
      </ng-container>
      <ng-template #newElseBlock>
        <div class="message-item text-break" #messageElement [attr.data-message-id]="message.id">
          <span class="other-player">{{ conversation.otherPlayer.displayName }}: </span>
          <span class="message-text">{{ message.content }}</span>
        </div>
      </ng-template>
    </ng-container>
  </div>
  <div class="d-flex message-input-box" (keydown.enter)="sendMessage(conversation.id, conversation.otherPlayer.id, conversation.otherPlayer.userName); messageToSend=''">
    <input id="message-input" class="flex-grow-1" placeholder="Send message" autocomplete="off" [(ngModel)]="messageToSend">
  </div>
</div>
