<div class="container">
  <div class="question-box">
    <h2>{{ questions[currentQuestionIndex].question }}</h2>
  </div>
  <div class="answer-boxes">
    <div *ngFor="let option of questions[currentQuestionIndex].options; let i = index"
         class="answer-box"
         [class.selected]="selectedAnswerIndex === i"
         [class.correct]="selectedAnswerIndex === i && answerIsCorrect"
         [class.incorrect]="selectedAnswerIndex === i && answerIsCorrect === false"
         (click)="selectAnswer(option, i)">
      {{option}}
    </div>
  </div>
  <button type="button" (click)="goToNextQuestion()">Next!</button>
</div>
