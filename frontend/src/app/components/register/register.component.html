<div class="container">
  <h2 class="text-center">Register</h2>
  <hr>
  <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
    <p *ngFor="let msg of errorMsg">{{ msg }}</p>
  </div>

  <div class="mb-3">
    <label for="inputUsername" class="form-label">Username</label>
    <input type="text" class="form-control" id="inputUsername"  [(ngModel)]="registerRequest.username">
  </div>
  <div class="mb-3">
    <label for="inputPassword" class="form-label">Password</label>
    <input type="password" class="form-control" id="inputPassword"  [(ngModel)]="registerRequest.password">
  </div>
  <div class="mb-3">
    <label for="inputDisplayName" class="form-label">Display name</label>
    <input type="text" class="form-control" id="inputDisplayName"  [(ngModel)]="registerRequest.displayName">
  </div>
  <div class="d-flex justify-content-between mb-3">
    <button (click)="register()" type="button" class="btn btn-primary">Register</button>
    <div>
      Already have an account?&nbsp;
      <button (click)="login()" type="button" class="btn btn-link">Login</button>
    </div>
  </div>

</div>
